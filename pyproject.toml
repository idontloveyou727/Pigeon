[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-ingest"
version = "0.1.0"
description = "Torn API ingest service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "discord.py>=2.4,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
pigeon-ingest = "pigeon_ingest.main:main"
pigeon-bot = "pigeon_ingest.discord_bot:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
