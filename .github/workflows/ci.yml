name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install project
        run: python -m pip install -e .

      - name: Compile source
        run: python -m compileall -q src

      - name: Run smoke test
        run: python tests/direct_python_smoke.py
